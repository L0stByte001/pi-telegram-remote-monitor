services:
  pi-telegram-controller:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-telegram-remote-monitor:1.3.0
    container_name: pi-telegram-remote-monitor
    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      PI_REMOTE_MONITOR_BIND_HOST: "0.0.0.0"
      PI_REMOTE_MONITOR_PORT: "47831"
      # Forward proxy configuration into the container.
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
      http_proxy: "${http_proxy:-}"
      https_proxy: "${https_proxy:-}"
      no_proxy: "${no_proxy:-localhost,127.0.0.1}"

    ports:
      # Expose the bridge only on the Windows host loopback interface.
      - "127.0.0.1:47831:47831"

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(47831,'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
